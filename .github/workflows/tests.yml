name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pickem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pickem_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway database inside this job; the name must end in _test.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pickem_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
    

      - name: Install dependencies
        
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        # No --set-env-vars / --set-secrets: the service keeps its existing settings and secret bindings.
        run: >-
          gcloud run deploy nfl-forecast
          --source .
          --project nfl-forecast-pick-em
          --region us-west1
          --allow-unauthenticated
          --quiet
