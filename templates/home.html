{% extends "base.html" %}
{% block content %}
  <h1>{{ site_name }}</h1>
  {% if current_user %}
    <p>You are logged in as <strong>{{ current_user.username }}</strong>.</p>
    {% if is_admin %}
      <p>You are the administrator.</p>
    {% endif %}
  {% else %}
    <p>You are not logged in.
      <a href="{{ url_for('login') }}">Log in</a> or
      <a href="{{ url_for('register') }}">register</a>.</p>
  {% endif %}
{% endblock %}
