<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 0 auto; padding: 1rem; line-height: 1.5; }
    nav { display: flex; gap: 1rem; align-items: center; border-bottom: 1px solid #ccc; padding-bottom: .5rem; }
    nav form { margin: 0; }
    nav button { background: none; border: none; padding: 0; color: #06c; cursor: pointer; font: inherit; text-decoration: underline; }
    .flash { padding: .5rem .75rem; border-radius: 4px; background: #e8f4e8; }
    .flash.error { background: #fbeaea; }
    label { display: block; margin-top: .75rem; }
    input { font: inherit; padding: .3rem; width: 100%; max-width: 20rem; box-sizing: border-box; }
    .games { list-style: none; padding: 0; }
    .games li { padding: .5rem 0; border-bottom: 1px solid #eee; }
    .games .kickoff, .games .result { color: #555; font-size: .9rem; }
    .games .forecast { margin-top: .25rem; }
    .games .forecast input { max-width: 6rem; }
    .field-error { color: #a00; font-size: .9rem; }
    .week-nav { justify-content: space-between; margin-top: 1rem; border-bottom: none; padding-bottom: 0; }
    button[type=submit].primary { margin-top: 1rem; font: inherit; padding: .4rem 1rem; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('current_week') }}">This week’s games</a>
    {% if current_user %}
      <form method="post" action="{{ url_for('logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Log out</button>
      </form>
    {% else %}
      <a href="{{ url_for('login') }}">Log in</a>
      <a href="{{ url_for('register') }}">Register</a>
    {% endif %}
  </nav>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <p class="flash {{ category }}">{{ message }}</p>
    {% endfor %}
  {% endwith %}

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
